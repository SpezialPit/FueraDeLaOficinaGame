<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fuera de la Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c14; --panel:#171a26; --panel2:#1f2332; --line:#343a52;
  --ink:#e6e9f5; --dim:#9aa2bd; --acc:#ffcc66; --acc2:#7ab0ff;
  --good:#7ce0a0; --bad:#e06a7a; --shadow:0 6px 0 rgba(0,0,0,.45);
  --pixel:'Press Start 2P', 'Courier New', monospace;
  --mono:'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){} }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--mono);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;max-width:1280px;max-height:100vh;overflow:hidden;background:#000}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(1.08) contrast(1.04)}
#stage{box-shadow:0 0 0 2px #242a3d,0 18px 60px rgba(0,0,0,.55);border-radius:8px}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 20%,transparent 78%,rgba(0,0,0,.08));mix-blend-mode:screen}
.hudbox,.pchip{box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}
.bbtn,.btn,.dchoice,.tbtn{box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)}


/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;padding:8px;
  align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;flex-wrap:wrap}
.hudbox{background:rgba(14,16,26,.82);border:2px solid var(--line);border-radius:4px;padding:6px 9px;max-width:46%}
.hudbox.right{text-align:right}
.hudch{font-family:var(--pixel);font-size:8px;color:var(--acc);line-height:1.6}
.hudobj{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.hudgold{font-family:var(--pixel);font-size:9px;color:var(--acc)}
.hudhint{font-size:10px;color:var(--dim);margin-top:3px}
.hudparty{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.pchip{background:rgba(14,16,26,.82);border:2px solid var(--line);border-radius:4px;padding:4px 6px;min-width:74px}
.pn{font-size:10px;font-weight:600}
.plv{font-size:9px;color:var(--dim);margin-left:4px}
.pb{height:4px;background:#0c0e16;border-radius:2px;margin-top:3px;overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#d8504a,#e8807a)}
.pb.en i{background:linear-gradient(90deg,#3f7fd8,#7ab0ff)}

/* ---------- DIÁLOGO ---------- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(94%,760px);
  background:linear-gradient(180deg,var(--panel),#12141f);border:3px solid var(--line);
  border-radius:6px;padding:12px 14px 14px;display:none;z-index:20;box-shadow:var(--shadow);cursor:pointer}
.dname{font-family:var(--pixel);font-size:9px;color:var(--acc);min-height:11px;margin-bottom:7px}
.dtext{font-size:14px;line-height:1.55;min-height:46px;white-space:pre-wrap}
.dnext{text-align:right;color:var(--acc2);font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.dchoices{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dchoice{font-family:var(--mono);font-size:13px;text-align:left;color:var(--ink);
  background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:9px 11px;cursor:pointer}
.dchoice:hover{border-color:var(--acc);background:#262b3d;color:var(--acc)}

/* ---------- COMBATE ---------- */
#battleui{position:absolute;left:0;right:0;bottom:0;padding:8px;display:none;z-index:15}
.blog{background:rgba(10,12,20,.86);border:2px solid var(--line);border-radius:4px;
  padding:6px 9px;font-size:11px;line-height:1.45;color:var(--dim);margin-bottom:6px;max-height:70px;overflow:hidden}
.blog div:last-child{color:var(--ink)}
.bactor{background:rgba(10,12,20,.9);border:2px solid var(--line);border-radius:4px;
  padding:6px 9px;font-size:11px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.bactor b{font-family:var(--pixel);font-size:9px;color:var(--acc)}
.ap{color:var(--acc);letter-spacing:2px}
.bhp{color:#e8807a}.ben{color:var(--acc2)}.bterr{color:var(--dim);margin-left:auto}
.btargets{display:flex;gap:6px;flex-wrap:wrap}
.bbtn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);background:var(--panel2);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:4px;padding:8px 11px;cursor:pointer}
.bbtn small{font-weight:400;color:var(--dim);font-size:10px}
.bbtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.bbtn:active:not(:disabled){border-bottom-width:2px;transform:translateY(2px)}
.bbtn:disabled{opacity:.35;cursor:not-allowed}
.bbtn.alt{background:#20232f;color:var(--dim)}
.blabel{font-size:11px;color:var(--dim);align-self:center;margin-right:4px}
.bwait{font-size:11px;color:var(--dim);padding:8px}

/* ---------- MENÚ ---------- */
#menu{position:absolute;inset:0;background:rgba(6,7,12,.92);display:none;z-index:30;
  align-items:center;justify-content:center;padding:10px}
.mwrap{width:min(100%,980px);height:min(100%,700px);background:var(--panel);
  border:3px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.mtabs{display:flex;gap:2px;padding:6px;background:#12141f;border-bottom:2px solid var(--line);
  flex-wrap:wrap;align-items:center}
.mtab{font-family:var(--pixel);font-size:8px;color:var(--dim);background:transparent;
  border:2px solid transparent;border-radius:3px;padding:8px 9px;cursor:pointer}
.mtab:hover{color:var(--ink)}
.mtab.on{color:var(--acc);border-color:var(--line);background:var(--panel2)}
.mtab.close{margin-left:auto;color:var(--bad)}
.shopgold{margin-left:auto;font-family:var(--pixel);font-size:9px;color:var(--acc);padding:0 10px}
.mbody{flex:1;overflow-y:auto;padding:12px}
.mbody h3{font-family:var(--pixel);font-size:9px;color:var(--acc);margin:14px 0 8px}
.mbody h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:5px;padding:10px}
.card.sm{font-size:12px}
.card.here{border-color:var(--acc)}
.chead{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.chead b{font-family:var(--pixel);font-size:9px;color:var(--acc)}
.tag{font-size:10px;color:var(--acc2);background:#141828;border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.lv{font-size:10px;color:var(--dim);margin-left:auto}
.cbio{font-size:11px;color:var(--dim);line-height:1.45;margin:5px 0}
.cbio.next{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--dim);margin:6px 0}
.stats b{color:var(--ink)}
.xpb{height:5px;background:#0c0e16;border-radius:3px;overflow:hidden;margin:6px 0 3px}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#c8a23c,#ffd980)}
.card small{font-size:10px;color:var(--dim)}
.eqrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.eqslot{flex:1;min-width:88px}
.eqslot small{display:block;margin-bottom:3px}
.eqslot select{width:100%;font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#12141f;border:2px solid var(--line);border-radius:3px;padding:5px}
.btn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);background:#2a3044;
  border:2px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:6px 10px;
  cursor:pointer;margin-top:6px;margin-right:5px}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{font-size:10px;padding:5px 7px}
.boosts{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.skills{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sk{border-left:3px solid var(--acc2);padding-left:8px}
.sk b{font-size:12px}
.qrow{background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:9px;margin-bottom:7px}
.qrow b{font-size:12px;color:var(--acc)}
.qrow small{font-size:10px;color:var(--acc2);margin-left:8px}
.axes{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.ax{display:flex;align-items:center;gap:9px;font-size:11px}
.ax span{width:88px;color:var(--dim)}
.ax .pb{flex:1;height:7px}
.ax .pb i{background:linear-gradient(90deg,#5aa0e0,#9ad0ff)}
.ax b{width:26px;text-align:right;color:var(--acc)}
.empty{font-size:12px;color:var(--dim)}
.minimap{width:100%;max-width:520px;image-rendering:pixelated;border:2px solid var(--line);
  border-radius:4px;background:#000;margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;margin-top:6px}
.mbody label{display:block;font-size:12px;margin:9px 0;color:var(--dim)}
.mbody input[type=range]{width:200px;vertical-align:middle;margin-left:8px}

/* ---------- TÍTULO / FINAL ---------- */
#title{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;
  z-index:40;padding:16px;background:
    radial-gradient(circle at 50% 30%,rgba(93,111,170,.22),transparent 28%),
    radial-gradient(ellipse at 50% 32%, #1c2138 0%, #0b0c14 68%)}
.tbox{width:min(100%,620px);text-align:center}
.tlogo{font-family:var(--pixel);font-size:clamp(14px,4.6vw,27px);color:var(--acc);
  line-height:1.7;text-shadow:0 4px 0 #6a4a10, 0 0 26px rgba(255,204,102,.28)}
.tsub{font-size:13px;color:var(--dim);margin:16px 0 26px;line-height:1.5}
.tbtn{display:block;width:100%;font-family:var(--pixel);font-size:10px;color:var(--ink);
  background:var(--panel2);border:3px solid var(--line);border-bottom-width:6px;border-radius:5px;
  padding:14px;margin:9px 0;cursor:pointer;line-height:1.5}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.tbtn:active{border-bottom-width:3px;transform:translateY(3px)}
.tbtn.alt{font-size:9px;background:#191d2a;color:var(--dim)}
.tslots{margin-top:14px;border-top:2px solid var(--line);padding-top:12px}
.tfoot{margin-top:20px;font-size:11px;color:var(--dim)}
.tbox.ending h1{font-family:var(--pixel);font-size:clamp(11px,3vw,17px);color:var(--acc);line-height:1.8}
.tbox.ending p{font-size:14px;line-height:1.7;color:var(--ink);text-align:left;margin:20px 0}
.tbox.ending .q{font-family:var(--pixel);font-size:10px;color:var(--acc2);text-align:center;line-height:1.9}
.stats2{font-size:11px;color:var(--dim);line-height:1.7;margin:18px 0;
  border-top:2px solid var(--line);padding-top:12px}

/* ---------- TOAST ---------- */
#toast{position:absolute;left:50%;transform:translateX(-50%);top:84px;z-index:50;
  background:rgba(10,12,20,.94);border:2px solid var(--acc);border-radius:4px;color:var(--acc);
  font-size:12px;padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%}
#toast.show{opacity:1}

/* ---------- TÁCTIL ---------- */
#touch{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
#touchpad{position:absolute;left:14px;bottom:14px;width:118px;height:118px;border-radius:50%;
  background:rgba(30,35,52,.4);border:3px solid rgba(90,100,140,.5);pointer-events:auto}
#touchpad::after{content:'';position:absolute;inset:34px;border-radius:50%;background:rgba(120,140,190,.35)}
.tbtnc{position:absolute;right:16px;width:64px;height:64px;border-radius:50%;
  background:rgba(35,40,60,.72);border:3px solid rgba(110,120,165,.6);color:var(--ink);
  font-family:var(--pixel);font-size:12px;pointer-events:auto;cursor:pointer}
#btnA{bottom:74px}
#btnB{bottom:6px;right:88px;width:54px;height:54px;font-size:9px}
@media (pointer:coarse){ #touch{display:block} #battleui{bottom:0} .hudhint{display:none} }
@media (max-width:640px){
  .hudbox{max-width:100%;padding:5px 7px}.hudobj{display:none}
  .dtext{font-size:13px}.mbody{padding:9px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="battleui"></div>
  <div id="dialog"></div>
  <div id="menu"></div>
  <div id="toast"></div>
  <div id="title"></div>
  <div id="touch">
    <div id="touchpad"></div>
    <button class="tbtnc" id="btnA">A</button>
    <button class="tbtnc" id="btnB">MENÚ</button>
  </div>
</div>
<script>
/*__GAME__*/
</script>
</body>
</html>
